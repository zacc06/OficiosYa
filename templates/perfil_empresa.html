{% extends 'base.html' %}{% block title %}Perfil de empresa{% endblock %}{% block content %}<section class="form-page wrap"><div class="form-intro"><div class="eyebrow muted">PERFIL EMPRESARIAL</div><h1>Datos de tu<br><em>empresa.</em></h1><p>El perfil público se comparte con quienes consultan proyectos empresariales.</p></div><form class="panel-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>{{ empresa.nombre_empresa }}</h2><label class="form-label">Nombre de la empresa<input name="nombre_empresa" required maxlength="160" value="{{ empresa.nombre_empresa }}"></label><label class="form-label">RUC<input name="ruc" required maxlength="32" value="{{ empresa.ruc }}"></label><label class="form-label">Dirección<input name="direccion" required maxlength="240" value="{{ empresa.direccion }}"></label><label class="form-label">Teléfono<input name="telefono_empresa" required maxlength="32" value="{{ empresa.telefono_empresa }}"></label><label class="form-label">Correo electrónico<input type="email" name="correo_empresa" required maxlength="254" value="{{ empresa.correo_empresa }}"></label><label class="form-label">Descripción<textarea name="descripcion" rows="4" maxlength="3000">{{ empresa.descripcion }}</textarea></label><button class="button button-primary full-button">Guardar perfil</button></form></section>{% endblock %}
